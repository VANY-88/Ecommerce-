services:
  # ASP.NET Core Web API (server/)
  - type: web
    name: furnitech-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Database is external (Neon), not a Render-managed resource.
      # Paste the Neon "pooled connection" string here after creating the
      # project — Render will prompt for this during the Blueprint setup
      # because it's marked `sync: false`.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Cloudflare R2 (product image storage). BucketName/PublicBaseUrl are
      # not secret and can be edited directly here; the other 3 are real
      # credentials — Render will prompt for them during Blueprint sync.
      - key: R2__AccountId
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__BucketName
        value: furnitech
      - key: R2__PublicBaseUrl
        value: https://pub-1eaa066d06f64d31ac4ce4020fbf10ab.r2.dev
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: WebShop.Api
      - key: Jwt__Audience
        value: WebShop.Client
      # VNPay/Momo merchant credentials. Declared here (sync:false) so the
      # Blueprint documents and prompts for them; if they're already set on
      # the live service outside this file, re-syncing won't overwrite them.
      - key: VnPay__TmnCode
        sync: false
      - key: VnPay__HashSecret
        sync: false
      - key: Momo__PartnerCode
        sync: false
      - key: Momo__AccessKey
        sync: false
      - key: Momo__SecretKey
        sync: false
      # Must match the client's public URL below (Render assigns
      # https://<name>.onrender.com unless the name is taken).
      - key: Cors__AllowedOrigins__0
        value: https://furnitech-client.onrender.com
      # Post-payment redirect target. Must match the client's public URL above —
      # without this, payment redirects fall back to localhost.
      - key: Frontend__BaseUrl
        value: https://furnitech-client.onrender.com
      # VNPay/Momo callback URLs point back at THIS service (the API), not the
      # client — they're where the payment gateway redirects/calls after payment,
      # which this API then forwards to Frontend__BaseUrl/payment/result.
      - key: VnPay__ReturnUrl
        value: https://furnitech-api.onrender.com/api/payments/vnpay/return
      - key: Momo__RedirectUrl
        value: https://furnitech-api.onrender.com/api/payments/momo/return
      - key: Momo__IpnUrl
        value: https://furnitech-api.onrender.com/api/payments/momo/ipn

  # React SPA (client/)
  - type: web
    name: furnitech-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/build
    envVars:
      # Must match the API service's public URL above.
      - key: REACT_APP_API_URL
        value: https://furnitech-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
