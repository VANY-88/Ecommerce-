services:
  # ASP.NET Core Web API (server/)
  - type: web
    name: furnitech-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    healthCheckPath: /api/products
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Database is external (Neon), not a Render-managed resource.
      # Paste the Neon "pooled connection" string here after creating the
      # project — Render will prompt for this during the Blueprint setup
      # because it's marked `sync: false`.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: WebShop.Api
      - key: Jwt__Audience
        value: WebShop.Client
      # Must match the client's public URL below (Render assigns
      # https://<name>.onrender.com unless the name is taken).
      - key: Cors__AllowedOrigins__0
        value: https://furnitech-client.onrender.com

  # React SPA (client/)
  - type: web
    name: furnitech-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/build
    envVars:
      # Must match the API service's public URL above.
      - key: REACT_APP_API_URL
        value: https://furnitech-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
